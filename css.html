<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Tabelas MySQL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        .table-display {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            overflow-x: auto;
        }
        
        .table-display th, .table-display td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        
        .table-display th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        
        .table-display tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .table-display tr:hover {
            background-color: #f1f1f1;
        }
        
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #select-btn {
            background-color: #2196F3;
        }
        
        #select-btn:hover {
            background-color: #0b7dda;
        }
        
        #edit-btn {
            background-color: #ff9800;
        }
        
        #edit-btn:hover {
            background-color: #e68a00;
        }
        
        .status-message {
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Visualizador de Tabelas MySQL</h1>
        
        <div class="button-group">
            <button id="select-btn">Selecionar Tabela</button>
            <button id="insert-btn">Inserir</button>
            <button id="edit-btn">Editar (Somar/Subtrair)</button>
        </div>
        
        <div id="status-message" class="status-message" style="display: none;"></div>
        
        <div class="table-container">
            <table class="table-display" id="data-table">
                <thead>
                    <tr>
                        <th colspan="3">Selecione uma tabela para visualizar os dados</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" style="text-align: center;">Nenhuma tabela selecionada</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
